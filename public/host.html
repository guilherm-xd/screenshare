<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compartilhar tela</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      video {
        width: 100%;
        max-width: 960px;
        background: #000;
        border-radius: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button,
      select,
      input {
        padding: 10px 14px;
        font-size: 15px;
        border-radius: 6px;
        border: 0;
      }
      button {
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #444;
        cursor: default;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        padding: 0;
      }
      .hint {
        max-width: 640px;
        margin: 0;
        font-size: 13px;
        opacity: 0.75;
        text-align: center;
        line-height: 1.5;
      }
      #stats {
        font-family: monospace;
        font-size: 13px;
        opacity: 0.85;
        text-align: center;
        line-height: 1.6;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <input id="key" type="password" placeholder="HOST_KEY" />
      <button id="start">Iniciar compartilhamento</button>
      <button id="stop" disabled>Parar</button>
    </div>
    <div class="row">
      <label
        >Codec
        <select id="codec">
          <option value="VP8" selected>VP8 (leve em software)</option>
          <option value="H264">H264 (melhor no celular)</option>
          <option value="VP9">VP9 (pesado)</option>
        </select>
      </label>
      <label
        >Bitrate
        <select id="bitrate">
          <option value="5000000">5 Mbps</option>
          <option value="10000000">10 Mbps</option>
          <option value="15000000" selected>15 Mbps</option>
          <option value="25000000">25 Mbps</option>
          <option value="40000000">40 Mbps</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>
        <input id="comm" type="checkbox" />
        Escutar comunicação
      </label>
    </div>
    <p class="hint">
      Desligada, o host pede só o áudio da janela compartilhada, o que deixa o
      Discord e apps de chamada de fora. Ligada, o áudio de todo o sistema vai
      junto. Vale ao iniciar o compartilhamento e só funciona ao compartilhar
      uma janela: a tela inteira sempre envia todo o áudio do sistema.
    </p>
    <video id="preview" autoplay muted playsinline></video>
    <div id="stats">Parado</div>

    <script>
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");
      const bitrateSel = document.getElementById("bitrate");
      const codecSel = document.getElementById("codec");
      const keyInput = document.getElementById("key");
      const preview = document.getElementById("preview");
      const statsEl = document.getElementById("stats");
      const commCheck = document.getElementById("comm");

      let ws = null;
      let stream = null;
      let wanted = false;
      let retryTimer = null;
      let queue = Promise.resolve();
      let iceServers = [];
      let captureInfo = "";
      let outInfo = "";
      let notice = "";
      let lastBytes = 0;
      let lastTime = 0;
      let audioCtx = null;
      let analyser = null;
      let levelMax = 0;
      let levelInfo = "";
      let audioInfo = "";
      let commInfo = "";
      const peers = new Map();

      async function loadIceServers(key) {
        const response = await fetch("/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ key }),
        });
        const config = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(
            config.error || "Não foi possível validar a HOST_KEY.",
          );
          error.status = response.status;
          throw error;
        }
        if (!Array.isArray(config.iceServers))
          throw new Error("Configuração ICE inválida.");
        iceServers = config.iceServers;
      }

      function send(data) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
      }

      function render() {
        const first = peers.values().next().value;
        const state = first ? first.connectionState : "sem espectador";
        const lines = [
          captureInfo,
          commInfo,
          levelInfo,
          `Espectador: ${state}`,
          outInfo,
          audioInfo,
          notice,
        ].filter(Boolean);
        statsEl.textContent = lines.join("\n");
      }

      async function tuneSender(sender) {
        const params = sender.getParameters();
        if (!params.encodings || !params.encodings.length)
          params.encodings = [{}];
        params.encodings[0].maxBitrate = Number(bitrateSel.value);
        params.encodings[0].maxFramerate = 60;
        params.degradationPreference = "maintain-framerate";
        try {
          await sender.setParameters(params);
        } catch (e) {
          console.warn(e);
        }
      }

      function preferCodec(pc) {
        const wanted = "video/" + codecSel.value.toLowerCase();
        const transceiver = pc
          .getTransceivers()
          .find((t) => t.sender.track && t.sender.track.kind === "video");
        if (!transceiver || !transceiver.setCodecPreferences) return;
        const codecs = RTCRtpSender.getCapabilities("video").codecs;
        const first = codecs.filter((c) => c.mimeType.toLowerCase() === wanted);
        const rest = codecs.filter((c) => c.mimeType.toLowerCase() !== wanted);
        if (first.length) transceiver.setCodecPreferences([...first, ...rest]);
      }

      async function createPeer(id) {
        if (peers.has(id)) removePeer(id);
        const pc = new RTCPeerConnection({ iceServers });
        peers.set(id, pc);
        lastTime = 0;

        pc.onicecandidate = (e) => {
          if (e.candidate)
            send({ type: "candidate", to: id, candidate: e.candidate });
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === "failed") {
            notice =
              "Falha na conexão direta. Se persistir, configure um servidor TURN.";
          }
          if (pc.connectionState === "connected") notice = "";
          render();
        };

        stream.getTracks().forEach((track) => {
          if (track.kind === "video") track.contentHint = "motion";
          pc.addTrack(track, stream);
        });

        preferCodec(pc);

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        send({ type: "offer", to: id, sdp: pc.localDescription });
        render();
      }

      function removePeer(id) {
        const pc = peers.get(id);
        if (pc) pc.close();
        peers.delete(id);
        lastTime = 0;
        render();
      }

      function closePeers() {
        peers.forEach((pc) => pc.close());
        peers.clear();
        lastTime = 0;
        render();
      }

      async function handle(msg) {
        if (msg.type === "denied") {
          notice = msg.blocked
            ? "Muitas tentativas erradas. Aguarde 10 minutos."
            : "HOST_KEY incorreta.";
          stop();
          return;
        }

        if (msg.type === "viewer-joined") await createPeer(msg.id);

        if (msg.type === "answer") {
          const pc = peers.get(msg.from);
          if (!pc || !msg.sdp) return;
          await pc.setRemoteDescription(msg.sdp);
          pc.getSenders()
            .filter((s) => s.track && s.track.kind === "video")
            .forEach(tuneSender);
        }

        if (msg.type === "candidate") {
          const pc = peers.get(msg.from);
          if (pc && pc.remoteDescription && msg.candidate) {
            await pc.addIceCandidate(msg.candidate).catch(() => {});
          }
        }

        if (msg.type === "viewer-left") removePeer(msg.id);
      }

      function openSocket() {
        clearTimeout(retryTimer);
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}`);
        ws.onopen = () => {
          notice = "";
          send({ type: "host", key: keyInput.value });
        };
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          queue = queue.then(() => handle(msg)).catch(console.error);
        };
        ws.onclose = () => {
          if (!wanted) return;
          closePeers();
          notice = "Reconectando ao servidor...";
          render();
          retryTimer = setTimeout(reconnectSocket, 3000);
        };
      }

      async function reconnectSocket() {
        if (!wanted) return;
        try {
          await loadIceServers(keyInput.value);
          openSocket();
        } catch (error) {
          if (error.status === 401 || error.status === 429) {
            notice = error.message;
            render();
            stop();
            return;
          }
          notice = "Reconectando ao servidor...";
          render();
          retryTimer = setTimeout(reconnectSocket, 3000);
        }
      }

      async function start() {
        if (!keyInput.value) {
          notice = "Informe a HOST_KEY.";
          render();
          return;
        }

        try {
          await loadIceServers(keyInput.value);
        } catch (error) {
          notice = error.message || "Não foi possível validar a HOST_KEY.";
          render();
          return;
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getDisplayMedia
        ) {
          notice =
            "Captura bloqueada: abra esta página por http://127.0.0.1:3000/host.html no Chrome ou Edge.";
          render();
          return;
        }

        stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 },
          },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          },
          windowAudio: commCheck.checked ? "system" : "window",
        });

        preview.srcObject = stream;
        stream.getVideoTracks()[0].onended = stop;

        const s = stream.getVideoTracks()[0].getSettings();
        const hasAudio = stream.getAudioTracks().length > 0;
        commInfo = describeComm(s.displaySurface);
        watchAudio();
        captureInfo = `Captura: ${s.width}x${s.height} @ ${Math.round(s.frameRate)}fps | áudio: ${hasAudio ? "capturado" : "NÃO capturado"}`;
        outInfo = "";
        notice = hasAudio
          ? ""
          : "Sem áudio. Pare, clique em Iniciar, escolha Tela inteira e marque Compartilhar áudio do sistema.";

        wanted = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        openSocket();
        render();
      }

      function stop() {
        wanted = false;
        clearTimeout(retryTimer);
        closePeers();
        if (stream) stream.getTracks().forEach((t) => t.stop());
        if (ws) {
          ws.onclose = null;
          ws.close();
        }
        stopWatching();
        stream = null;
        ws = null;
        preview.srcObject = null;
        captureInfo = "";
        commInfo = "";
        outInfo = "";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        render();
      }

      function watchAudio() {
        stopWatching();
        if (!stream || !stream.getAudioTracks().length) return;
        audioCtx = new AudioContext();
        audioCtx.resume().catch(() => {});
        const source = audioCtx.createMediaStreamSource(
          new MediaStream(stream.getAudioTracks()),
        );
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
      }

      function stopWatching() {
        if (audioCtx) audioCtx.close().catch(() => {});
        audioCtx = null;
        analyser = null;
        levelInfo = "";
        audioInfo = "";
        levelMax = 0;
      }

      function audioLevel() {
        if (!analyser) return 0;
        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);
        let peak = 0;
        for (let i = 0; i < data.length; i++)
          peak = Math.max(peak, Math.abs(data[i] - 128));
        return Math.round((peak / 128) * 100);
      }

      async function pollStats() {
        levelInfo = analyser ? `Nível do som capturado: ${levelMax}%` : "";
        levelMax = 0;
        const first = peers.values().next().value;
        if (!first) {
          outInfo = "";
          audioInfo = "";
          render();
          return;
        }
        const report = await first.getStats();
        let audioSent = 0;
        report.forEach((r) => {
          if (r.type === "outbound-rtp" && r.kind === "audio")
            audioSent = r.bytesSent || 0;
          if (r.type === "outbound-rtp" && r.kind === "video") {
            let mbps = 0;
            if (
              lastTime &&
              r.timestamp > lastTime &&
              r.bytesSent >= lastBytes
            ) {
              mbps =
                ((r.bytesSent - lastBytes) * 8) /
                ((r.timestamp - lastTime) / 1000) /
                1e6;
            }
            lastBytes = r.bytesSent;
            lastTime = r.timestamp;
            const limit = r.qualityLimitationReason || "none";
            outInfo = `Envio: ${r.frameWidth || 0}x${r.frameHeight || 0} @ ${Math.round(r.framesPerSecond || 0)}fps, ${mbps.toFixed(1)} Mbps, limitado por: ${limit}, codificador: ${r.encoderImplementation || "desconhecido"}`;
          }
        });
        audioInfo = analyser
          ? `Áudio enviado: ${Math.round(audioSent / 1024)} kB`
          : "";
        render();
      }

      function describeComm(surface) {
        if (commCheck.checked) {
          return "Comunicação: ligada (áudio de todo o sistema, incluindo chamadas)";
        }
        if (surface === "monitor") {
          return "Comunicação: desligada, mas a tela inteira envia todo o áudio do sistema (Discord incluído). Compartilhe uma janela para deixá-lo de fora.";
        }
        return "Comunicação: desligada (pedido só o áudio da janela compartilhada)";
      }

      commCheck.onchange = () => {
        if (!stream) return;
        commInfo =
          "A mudança em Escutar comunicação vale na próxima vez que você iniciar o compartilhamento.";
        render();
      };

      setInterval(() => pollStats().catch(() => {}), 1000);
      setInterval(() => {
        levelMax = Math.max(levelMax, audioLevel());
      }, 100);
      startBtn.onclick = () =>
        start().catch((e) => {
          if (e && e.name === "NotAllowedError") {
            notice =
              "Compartilhamento cancelado ou bloqueado. Clique em Iniciar, escolha uma tela e confirme em Compartilhar.";
          } else {
            notice = `Não foi possível iniciar a captura: ${e && e.name}${e && e.message ? " - " + e.message : ""}`;
          }
          render();
          console.error(e);
        });
      stopBtn.onclick = stop;

      bitrateSel.onchange = () => {
        peers.forEach((pc) => {
          pc.getSenders()
            .filter((sender) => sender.track && sender.track.kind === "video")
            .forEach(tuneSender);
        });
      };

      codecSel.onchange = () => {
        if (!stream) return;
        const ids = [...peers.keys()];
        queue = queue
          .then(async () => {
            for (const id of ids) await createPeer(id);
          })
          .catch(console.error);
      };
    </script>
  </body>
</html>

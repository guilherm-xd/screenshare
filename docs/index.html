<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Assistir tela</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 150px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }
      #stats {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        font-family: monospace;
        font-size: 12px;
      }
      #controls {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        background: #3b82f6;
        color: #fff;
        font-size: 14px;
      }
      #gate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #000;
        padding: 20px;
      }
      #gate input,
      #gate button {
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
        padding: 12px 14px;
        font-size: 16px;
        border-radius: 6px;
        border: 0;
      }
      #gate button {
        background: #3b82f6;
        color: #fff;
      }
      #msg {
        font-size: 14px;
        color: #f87171;
        min-height: 18px;
        text-align: center;
      }
      #serverWarning {
        width: 100%;
        max-width: 320px;
        margin: 0;
        color: #d1d5db;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="status"></div>
    <div id="stats"></div>
    <div id="controls">
      <button id="unmute">Ativar som</button>
      <button id="full">Tela cheia</button>
    </div>
    <div id="gate">
      <div id="msg"></div>
      <input
        id="server"
        type="text"
        placeholder="Endereço do servidor"
        autocapitalize="off"
        autocorrect="off"
        autocomplete="url"
        spellcheck="false"
      />
      <p id="serverWarning">
        Confira o endereço do servidor e só informe a chave se você confiar
        nele.
      </p>
      <input
        id="key"
        type="password"
        placeholder="Chave de acesso"
        autocomplete="current-password"
      />
      <button id="enter">Entrar</button>
    </div>

    <script>
      const video = document.getElementById("video");
      const statusEl = document.getElementById("status");
      const statsEl = document.getElementById("stats");
      const gate = document.getElementById("gate");
      const msgEl = document.getElementById("msg");
      const serverInput = document.getElementById("server");
      const keyInput = document.getElementById("key");

      const onPages =
        location.hostname === "github.io" ||
        location.hostname.endsWith(".github.io");

      function normalize(value) {
        const input = value.trim();
        if (!input) return "";
        const address = /^[a-z][a-z0-9+.-]*:\/\//i.test(input)
          ? input
          : `https://${input}`;
        const parsed = new URL(address);
        if (
          !["http:", "https:"].includes(parsed.protocol) ||
          parsed.username ||
          parsed.password ||
          parsed.pathname !== "/" ||
          parsed.search ||
          parsed.hash
        ) {
          throw new Error(
            "Informe somente o endereço do servidor, sem caminho ou credenciais.",
          );
        }
        if (
          parsed.protocol === "http:" &&
          !["localhost", "127.0.0.1", "[::1]"].includes(parsed.hostname)
        ) {
          throw new Error("Use HTTPS para servidores que não sejam locais.");
        }
        return parsed.host;
      }

      let server = onPages ? "" : location.host;
      serverInput.value = server;

      let viewerKey = "";
      let iceServers = [];
      let pc = null;
      let ws = null;
      let statsTimer = null;
      let retryTimer = null;
      let stopped = false;
      let queue = Promise.resolve();
      let pendingCandidates = [];

      function endpoints() {
        const secure =
          server === location.host ? location.protocol === "https:" : true;
        return {
          http: `${secure ? "https" : "http"}://${server}`,
          ws: `${secure ? "wss" : "ws"}://${server}`,
        };
      }

      function setStatus(text) {
        statusEl.textContent = text;
        statusEl.style.display = text ? "block" : "none";
      }

      function showGate(message) {
        msgEl.textContent = message || "";
        serverInput.style.display = "";
        gate.style.display = "flex";
      }

      async function loadIceServers(key) {
        const res = await fetch(`${endpoints().http}/config`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ key }),
        });
        const config = await res.json().catch(() => ({}));
        if (!res.ok) {
          const error = new Error(
            config.error || "Não foi possível validar a chave.",
          );
          error.status = res.status;
          throw error;
        }
        if (!Array.isArray(config.iceServers))
          throw new Error("Configuração do servidor inválida.");
        iceServers = config.iceServers;
      }

      function send(data) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
      }

      function closePeer() {
        if (pc) pc.close();
        pc = null;
        clearInterval(statsTimer);
        video.srcObject = null;
        statsEl.textContent = "";
      }

      async function handle(msg) {
        if (msg.type === "waiting") setStatus("Aguardando o host iniciar...");

        if (msg.type === "host-left") {
          closePeer();
          pendingCandidates = [];
          setStatus("O host encerrou a transmissão. Aguardando...");
        }

        if (msg.type === "offer") {
          closePeer();
          setStatus("Conectando...");
          const current = new RTCPeerConnection({ iceServers });
          pc = current;

          current.onicecandidate = (e) => {
            if (e.candidate)
              send({ type: "candidate", candidate: e.candidate });
          };

          current.onconnectionstatechange = () => {
            const state = current.connectionState;
            if (state === "connected") setStatus("");
            if (state === "connecting") setStatus("Conectando...");
            if (state === "disconnected") setStatus("Conexão instável...");
            if (state === "failed")
              setStatus(
                "Falha na conexão direta. Pode ser necessário um servidor TURN.",
              );
          };

          current.ontrack = (e) => {
            if (video.srcObject !== e.streams[0])
              video.srcObject = e.streams[0];
            video.play().catch(() => {});
          };

          await current.setRemoteDescription(msg.sdp);
          for (const c of pendingCandidates) {
            await current.addIceCandidate(c).catch(() => {});
          }
          pendingCandidates = [];

          const answer = await current.createAnswer();
          await current.setLocalDescription(answer);
          send({ type: "answer", sdp: current.localDescription });

          current.getReceivers().forEach((r) => {
            if ("playoutDelayHint" in r) r.playoutDelayHint = 0;
            if ("jitterBufferTarget" in r) r.jitterBufferTarget = 0;
          });

          statsTimer = setInterval(showStats, 1000);
        }

        if (msg.type === "candidate" && msg.candidate) {
          if (pc && pc.remoteDescription)
            await pc.addIceCandidate(msg.candidate).catch(() => {});
          else pendingCandidates.push(msg.candidate);
        }
      }

      async function showStats() {
        if (!pc) return;
        const report = await pc.getStats();
        let videoText = "";
        let audioBytes = 0;
        report.forEach((r) => {
          if (r.type === "inbound-rtp" && r.kind === "video") {
            videoText = `${r.frameWidth || 0}x${r.frameHeight || 0} @ ${Math.round(r.framesPerSecond || 0)}fps`;
          }
          if (r.type === "inbound-rtp" && r.kind === "audio") {
            audioBytes = r.bytesReceived || 0;
          }
        });
        statsEl.textContent = `${videoText} | áudio: ${audioBytes > 0 ? "recebendo" : "sem sinal"}`;
      }

      function connect() {
        clearTimeout(retryTimer);
        stopped = false;
        if (ws) {
          ws.onclose = null;
          ws.close();
        }
        ws = new WebSocket(endpoints().ws);
        ws.onopen = () => send({ type: "viewer", key: viewerKey });
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === "denied" || msg.type === "replaced") {
            stopped = true;
            closePeer();
            if (msg.type === "denied") {
              viewerKey = "";
              showGate(
                msg.blocked
                  ? "Muitas tentativas. Aguarde 10 minutos."
                  : "Chave incorreta",
              );
            } else {
              setStatus(
                "Aberto em outra aba ou aparelho. Recarregue para assistir aqui.",
              );
            }
            return;
          }
          queue = queue.then(() => handle(msg)).catch(console.error);
        };
        ws.onclose = () => {
          if (stopped) return;
          closePeer();
          pendingCandidates = [];
          setStatus("Reconectando...");
          retryTimer = setTimeout(reconnect, 3000);
        };
      }

      async function reconnect() {
        if (stopped || !viewerKey) return;
        try {
          await loadIceServers(viewerKey);
          connect();
        } catch (error) {
          if (error.status === 401 || error.status === 429) {
            stopped = true;
            viewerKey = "";
            showGate(error.message);
            return;
          }
          setStatus("Reconectando...");
          retryTimer = setTimeout(reconnect, 3000);
        }
      }

      async function enter() {
        try {
          server = normalize(serverInput.value);
        } catch (error) {
          msgEl.textContent = error.message || "Endereço do servidor inválido.";
          return;
        }
        if (!server) {
          msgEl.textContent = "Informe o endereço do servidor.";
          return;
        }
        if (!keyInput.value) {
          msgEl.textContent = "Informe a chave de acesso.";
          return;
        }
        viewerKey = keyInput.value;
        try {
          await loadIceServers(viewerKey);
        } catch (error) {
          msgEl.textContent =
            error.status === 401 || error.status === 429
              ? error.message
              : "Não foi possível alcançar o servidor ou a origem não está autorizada.";
          return;
        }
        gate.style.display = "none";
        setStatus("Conectando...");
        connect();
      }

      document.getElementById("enter").onclick = enter;
      keyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") enter();
      });

      document.getElementById("unmute").onclick = (e) => {
        video.muted = !video.muted;
        e.target.textContent = video.muted ? "Ativar som" : "Silenciar";
      };

      document.getElementById("full").onclick = () => {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      };

      showGate("");
    </script>
  </body>
</html>
